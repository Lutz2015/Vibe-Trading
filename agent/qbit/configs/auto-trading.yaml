enabled: true
mode: paper
execution_mode: paper
poll_interval_sec: 60

trading_hours:
  start: "09:30"
  end: "15:00"

rebalance:
  time_local: "14:50"
  window_minutes: 30
  rebalance_every_trading_days: 15

portfolio:
  initial_cash: 1000000
  total_exposure: 1.0
  max_single_weight: 0.5
  risk_aversion: 1.0
  min_trade_lot: 100
  fee_bps: 3.0

# 可选策略：界面「策略仓库」里可切换启用。默认只开动量。
strategies:
  - strategy_id: momentum_topn
    label: 日内动量 Top N
    enabled: true
    expected_return_pct: 18.0
    risk_volatility_pct: 12.0
    max_weight: 0.7
    params:
      mode: momentum
      top_n: 4
      universe_symbols:
        - "000001.SZ"
        - "600519.SH"
        - "000858.SZ"
        - "601318.SH"
        - "600036.SH"
        - "000333.SZ"
        - "601166.SH"
        - "600900.SH"

  - strategy_id: mean_reversion_topn
    label: 均值回归 Top N
    enabled: false
    expected_return_pct: 12.0
    risk_volatility_pct: 10.0
    max_weight: 0.5
    params:
      mode: mean_reversion
      top_n: 4
      universe_symbols:
        - "000001.SZ"
        - "600519.SH"
        - "000858.SZ"
        - "601318.SH"
        - "600036.SH"
        - "000333.SZ"
        - "601166.SH"
        - "600900.SH"

  - strategy_id: equal_weight_core
    label: 核心等权
    enabled: false
    expected_return_pct: 10.0
    risk_volatility_pct: 8.0
    max_weight: 0.25
    params:
      mode: equal_weight
      top_n: 8
      universe_symbols:
        - "000001.SZ"
        - "600519.SH"
        - "000858.SZ"
        - "601318.SH"
        - "600036.SH"
        - "000333.SZ"
        - "601166.SH"
        - "600900.SH"
